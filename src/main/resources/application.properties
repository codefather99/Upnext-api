spring.application.name=upnext-api
server.port=${PORT:8081}
# Bump with every release, together with CHANGELOG.md and the git tag (see docs/VERSIONING.md)
upnext.version=0.1.0

# Local Postgres via docker-compose, or a Neon database through environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/upnext}
spring.datasource.username=${DB_USER:upnext}
spring.datasource.password=${DB_PASSWORD:upnext}

# Versioned migrations: V1-V99 data and rules, V100-V199 auth. NEVER edit an applied migration; add a new V file and a down script.
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true

# The default secret is for local development ONLY: set UPNEXT_JWT_SECRET (48+ characters) in every deployed environment.
upnext.jwt.secret=${UPNEXT_JWT_SECRET:dev-only-secret-change-me-dev-only-secret}
upnext.jwt.ttl-minutes=60

# Origins allowed to call the API from a browser. Add the deployed interface via UPNEXT_CORS_ORIGINS (comma separated).
upnext.cors.allowed-origins=${UPNEXT_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# DEMONSTRATION data: one admin (admin@upnext.demo) and eight users (ada@, tunde@ ... @upnext.demo), all with this password.
upnext.demo.password=${UPNEXT_DEMO_PASSWORD:Demo-Pass-1}
upnext.seed.enabled=${UPNEXT_SEED:true}

management.endpoints.web.exposure.include=health
