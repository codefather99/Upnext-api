services:
  db:
    image: postgres:16
    container_name: upnext-db
    environment:
      POSTGRES_DB: upnext
      POSTGRES_USER: upnext
      POSTGRES_PASSWORD: upnext
    ports:
      - "${UPNEXT_DB_PORT:-5436}:5432"
    volumes:
      - upnext-pgdata:/var/lib/postgresql/data
volumes:
  upnext-pgdata:
